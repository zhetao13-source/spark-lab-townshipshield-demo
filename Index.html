<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TownshipShield – Flood Early Warning (Simulated)</title>
<style>
:root{--navy:#1B2B4B;--bg:#F3F6FB;--mut:#64748b;--g:#2E9E6B;--o:#F59E0B;--r:#DC2626;--line:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--navy);display:flex;min-height:100vh}
aside{width:200px;background:var(--navy);color:#fff;padding:16px 12px;position:sticky;top:0;height:100vh;flex-shrink:0}
aside h1{font-size:17px;margin:0}aside small{color:#9fb0d0}
nav{margin-top:18px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#cdd7ec;padding:10px;border-radius:8px;font:inherit;cursor:pointer;margin-top:4px}
nav button.on{background:#2f4678;color:#fff}
nav button:focus-visible,button:focus-visible{outline:2px solid #6ea8ff;outline-offset:2px}
main{flex:1;min-width:0;padding:14px 18px}
.bar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px;position:sticky;top:8px;z-index:5}
.bar .sl{flex:1;min-width:180px;display:flex;gap:8px;align-items:center}.bar input[type=range]{flex:1}
.badge{background:#e8f0ff;color:#2748a3;border-radius:99px;padding:3px 10px;font-size:12px}
button.b{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
button.b.red{background:var(--r)}button.b.alt{background:#fff;color:var(--navy);border:1px solid var(--line)}
select{font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line)}
h2{margin:6px 0 12px;font-size:20px}h3{margin:0 0 8px;font-size:15px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:12px}
.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-bottom:12px}
.c{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;overflow-x:auto}
.k{font-size:26px;font-weight:700}.m{color:var(--mut);font-size:12px}
.p{display:inline-block;padding:2px 9px;border-radius:99px;color:#fff;font-size:12px;white-space:nowrap}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600;font-size:12px}
.bg{height:9px;border-radius:5px;background:#e9eef6;overflow:hidden;min-width:80px}.bg i{display:block;height:100%}
.msg{border-left:4px solid var(--o);background:#fffbf0;padding:8px 10px;border-radius:6px;margin-top:8px}
.ph{max-width:330px;margin:0 auto;border:8px solid var(--navy);border-radius:28px;background:#fff;padding:14px}
.big{border-radius:14px;padding:16px;color:#fff;margin:10px 0}.big b{font-size:22px;display:block}
.col{display:grid;gap:8px;grid-template-columns:repeat(3,1fr)}.col>div{background:#f6f8fc;border-radius:10px;padding:8px;min-height:70px}
.wo{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:6px;font-size:13px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:9}
@media(max-width:760px){body{flex-direction:column}aside{width:100%;height:auto;position:static}nav{display:flex;gap:4px;overflow-x:auto;margin-top:8px}nav button{white-space:nowrap;width:auto}.col{grid-template-columns:1fr}}
@media(prefers-reduced-motion:no-preference){.bg i,.big{transition:all .4s}}
@media(prefers-reduced-motion:no-preference){.dr{animation:dft 7s ease-in-out infinite}.rn line{animation:fall .9s linear infinite}@keyframes dft{50%{transform:translate(9px,-6px)}}@keyframes fall{to{stroke-dashoffset:-28}}}
.ml{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}.ml label{cursor:pointer}
.im{position:relative;line-height:0;background:#eaf0ec;border-radius:12px}.im img{width:100%;height:auto;display:block;border-radius:12px}.im svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
</style></head><body>

const dk=DR.map(d=>[d,Math.min(99,Math.round(d[3]+rain*.3))]);
const pn=S.lay.pins?dk.map(([d,r])=>{const q=PIN[d[0]],c=MC[r>=70?2:r>=45?1:0];return `<rect x="${q[0]-52}" y="${q[1]-21}" width="104" height="42" rx="14" fill="${c}" stroke="#fff" stroke-width="3"/><circle cx="${q[0]-32}" cy="${q[1]}" r="8" fill="#fff"/><text x="${q[0]+12}" y="${q[1]+8}" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">${d[0]}</text>`}).join(''):'';
const cp=dk.filter(([d,r])=>r>=45).map(([d,r])=>`<span class="p" style="background:${r>=70?'#fdeaea':'#fdf3dc'};color:${r>=70?'#c0392b':'#8a5a12'}">${r>=70?'! ':''}${d[0]} · ${r>=70?'High':'Moderate'}</span>`).join('');
return `<div class="ml">Township: ${[['pu','Putra Heights'],['se','Serenia City']].map(a=>`<button class="b ${S.tw==a[0]?'':'alt'}" onclick="setTw('${a[0]}')">${a[1]}</button>`).join('')}</div>
<div class="im" style="margin-top:8px"><img src="${T.img}" alt="${T.alt}"><svg viewBox="0 0 ${T.vw} ${T.vh}" role="img" aria-label="Rain and flood risk overlay"><defs>${MC.map((c,i)=>`<radialGradient id="rg${i}"><stop offset="0" stop-color="${c}" stop-opacity=".75"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>`).join('')}</defs>${zn}${rad}${rn}${hh}${lb}${pn}</svg></div>
<div class="ml">${cp||'<span class="m">No drains at elevated clog risk.</span>'}</div>
<div class="ml">${[['radar','Rain radar'],['pins','Drain pins'],['hh','Households']].map(a=>`<label><input type="checkbox" ${S.lay[a[0]]?'checked':''} onchange="S.lay.${a[0]}=this.checked?1:0;render()"> ${a[1]}</label>`).join('')}<span style="flex:1"></span>${[['Now',0],['+1 hour',1],['+3 hours',2]].map(a=>`<button class="b ${S.fc==a[1]?'':'alt'}" onclick="S.fc=${a[1]};render()">${a[0]}</button>`).join('')}</div>
<div class="m">${T.credit} Every zone gets the same rainfall; the colour depends on each zone's flood vulnerability. Rain radar, zones, drains and households are illustrative overlays with simulated data, not SDP data. Forecast views are simulated (+1 hour = 1.5x, +3 hours = 2.2x current rain).</div>`}
const PG={
dash(){const I=idx(),L=lv(),mx=Math.max(...L),act=L.filter(x=>x>0).length;
return `<h2>Command dashboard</h2><div class="g">${K('Rainfall now',S.rain+' mm/h',S.rain>=60?'Heavy':S.rain>=30?'Moderate':'Light')}${K('3-hour peak forecast',Math.round(S.rain*2.2)+' mm/h','Simulated nowcast')}${K('Main drain water level',Math.min(3,.6+S.rain*.025).toFixed(1)+' m','of 3.0 m capacity')}${K('Active alerts',act,L.filter(x=>x==2).length+' danger, '+L.filter(x=>x==1).length+' caution')}</div>
<div class="g2"><div class="c"><h3>Rain and flood risk map: ${TW[S.tw].short}</h3>${mapView()}</div>
<div class="c"><h3>Zone watchlist</h3><table><tr><th>Zone</th><th>Index</th><th>Level</th><th>Action</th></tr>${Z.map((z,i)=>`<tr><td>${z.n}</td><td>${I[i].toFixed(0)}</td><td>${pill(L[i])}</td><td>${ACT[L[i]]}</td></tr>`).join('')}</table>
<p class="m">Overall township status: ${pill(mx)}</p></div></div>`},
alerts(){const I=idx(),L=lv(),mx=Math.max(...L),w=I.indexOf(Math.max(...I)),zn=Z[w].n,t=M[S.lang][mx](zn);
return `<h2>Smart alert centre</h2><div class="g2"><div class="c"><h3>Rainfall threshold rules</h3><table><tr><td>${pill(0)}</td><td>Index below 25: monitor</td></tr><tr><td>${pill(1)}</td><td>Index 25 to 49: notify management, inspect drains</td></tr><tr><td>${pill(2)}</td><td>Index 50 or more: alert all residents, activate shelters</td></tr></table>
<p class="m">Flow: rainfall data, then risk engine, then alert to management and residents (push, SMS, WhatsApp).</p></div>
<div class="c"><h3>Message previews</h3><div class="m">To management (${NM[mx]})</div><div class="msg" style="border-color:${CL[mx]}">${t}${mx>0?' Dispatch drain crew.':''}</div>
<div class="m" style="margin-top:10px">To residents of ${zn}</div><div class="msg" style="border-color:${CL[mx]}">${t}</div></div></div>
<div class="c"><h3>Simulated send log</h3>${S.log.length?`<table><tr><th>Time</th><th>Zone</th><th>Level</th><th>Message</th><th>Sent via</th></tr>${S.log.map(e=>`<tr><td>${e.t}</td><td>${e.z}</td><td>${pill(e.l)}</td><td>${M[S.lang][e.l](e.z)}</td><td>Push, SMS, WhatsApp</td></tr>`).join('')}</table>`:'<p class="m">No alerts yet. Move the rainfall slider or tap Simulate heavy rain.</p>'}</div>`},
fin(){const zl=Z.map(z=>z.val*ratio(z)),tot=zl.reduce((a,b)=>a+b,0),mx=Math.max(...zl,.01),ex=Z.reduce((a,z)=>a+z.val,0);
return `<h2>Financial risk assessment</h2><div class="c" style="margin-bottom:12px"><h3>Rainfall scenario</h3>${[['10-year',45],['50-year',75],['100-year',110]].map(a=>`<button class="b ${S.rain==a[1]?'':'alt'}" onclick="setRain(${a[1]})">${a[0]} (${a[1]} mm/h)</button> `).join('')}<p class="m">Pick a scenario or use the rainfall slider above. All figures update live.</p></div>
<div class="g">${K('Scenario loss','RM '+tot.toFixed(2)+'m',(tot/ex*100).toFixed(2)+'% of RM '+ex+'m exposed')}${K('Estimated claim cost','RM '+(tot*.7).toFixed(2)+'m','Assumes 70% insured')}${K('Uninsured gap','RM '+(tot*.3).toFixed(2)+'m','Borne by SDP and owners')}${K('Expected annual loss','RM 1.24m','Per year, simulated')}</div>
<div class="g2"><div class="c"><h3>Loss by zone</h3><table>${Z.map((z,i)=>`<tr><td>${z.n}</td><td style="width:45%">${bar(zl[i]/mx*100,CL[lvl(S.rain*z.v)])}</td><td>RM ${zl[i].toFixed(2)}m</td></tr>`).join('')}</table></div>
<div class="c"><h3>Asset exposure register</h3><table><tr><th>Asset</th><th>Zone</th><th>Value</th><th>Risk</th><th>Potential loss</th></tr>${AS.map(a=>{const z=Z.find(q=>q.id==a[1]);return `<tr><td>${a[0]}</td><td>${z.n}</td><td>RM ${a[2]}m</td><td>${pill(lvl(S.rain*z.v))}</td><td>RM ${(a[2]*ratio(z)).toFixed(2)}m</td></tr>`}).join('')}</table></div></div>`},
mnt(){const col=['To do','In progress','Done'];
return `<h2>Preventive maintenance</h2><div class="g2"><div class="c"><h3>Drain and culvert register</h3><table><tr><th>Asset</th><th>Zone</th><th>Condition</th><th>Clog risk</th></tr>${DR.map(d=>{const r=Math.min(99,Math.round(d[3]+S.rain*.3));return `<tr><td>${d[0]}</td><td>${d[1]}</td><td>${d[2]}</td><td>${bar(r,r>=70?CL[2]:r>=45?CL[1]:CL[0])}${r}%</td></tr>`}).join('')}</table><p class="m">Clog risk rises with rainfall load.</p></div>
<div class="c"><h3>Pre-storm checklist</h3>${CK.map((c,i)=>`<label style="display:block;margin:6px 0"><input type="checkbox" ${S.ck[i]?'checked':''} onchange="S.ck[${i}]=this.checked?1:0;render()"> ${c}</label>`).join('')}<p class="m">${S.ck.filter(x=>x).length} of ${CK.length} ready</p></div></div>
<div class="c"><h3>Work-order board</h3><div class="col">${col.map((n,s)=>`<div><b>${n}</b>${S.orders.map((o,i)=>o.s==s?`<div class="wo">${o.t}${s<2?` <button class="b alt" onclick="S.orders[${i}].s++;render()">Move on</button>`:''}</div>`:'').join('')}</div>`).join('')}</div></div>`},
res(){const I=idx(),L=lv(),i=Z.findIndex(z=>z.id==S.zone),l=L[i],z=Z[i];
return `<h2>Resident app</h2><div class="ph"><select onchange="S.zone=this.value;render()" aria-label="Your zone" style="width:100%">${Z.map(q=>`<option value="${q.id}" ${q.id==S.zone?'selected':''}>${q.n}</option>`).join('')}</select>
<div class="big" style="background:${CL[l]}"><span>${NM[l]}</span><b>${H[S.lang][l]}</b>${M[S.lang][l](z.n)}</div>
<div class="m">Rainfall ${S.rain} mm/h · risk index ${I[i].toFixed(0)}</div>
<h3 style="margin-top:12px">Shelters and safe routes</h3><div class="wo">Community hall (example), 400 m, open</div><div class="wo">Primary school (example), 650 m, ${l==2?'activated':'on standby'}</div>
<button class="b" style="width:100%;margin-top:12px" onclick="report()">Report blocked drain</button>
<h3 style="margin-top:12px">Alert history</h3>${S.log.slice(0,3).map(e=>`<div class="wo">${e.t} · ${e.z} · ${H[S.lang][e.l]}</div>`).join('')||'<p class="m">No alerts yet.</p>'}</div>`}};
const TABS=[['dash','Command dashboard'],['alerts','Alert centre'],['fin','Financial risk'],['mnt','Maintenance'],['res','Resident app']];
function render(){$('#twn').textContent='Example township: '+TW[S.tw].full+'. Zones, drains and homes are illustrative, not SDP data. Simulation only, not a real flood warning.';$('#nav').innerHTML=TABS.map(t=>`<button class="${S.page==t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');$('#pg').innerHTML=PG[S.page]()}
function go(p){S.page=p;render()}
function upd(){const c=lv();if(S.prev)Z.forEach((z,i)=>{if(c[i]!==S.prev[i])S.log.unshift({t:now(),z:z.n,l:c[i]})});S.log=S.log.slice(0,12);S.prev=c;$('#rv').textContent=S.rain;$('#rs').value=S.rain;render()}
function setRain(v){S.rain=v;upd()}
let tm;function sim(){clearInterval(tm);tm=setInterval(()=>{if(S.rain>=95){clearInterval(tm);return}S.rain=Math.min(95,S.rain+5);upd()},500)}
function reset(){clearInterval(tm);S.rain=15;S.log=[];S.prev=lv();upd()}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}
function report(){const z=Z.find(q=>q.id==S.zone);S.orders.unshift({t:'Resident report: blocked drain in '+z.n,s:0});toast('Report sent. Added to the maintenance work orders.');render()}
applyTw();S.prev=lv();render();
</script></body></html>
